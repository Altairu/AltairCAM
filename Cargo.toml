[package]
name = "altair_cam"
version = "2.0.3"
edition = "2021"
description = "PCB CNC CAM Software"
authors = ["Altairu"]

[[bin]]
name = "AltairCAM"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
rfd = "0.18.0"
i_overlay = "9.1.0"
ureq = { version = "3.5.2", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
